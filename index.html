  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#12082b">
  <meta name="description" content="Join the official DM First Channel community on Telegram.">
  <title>DM First Channel</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%237c3aed'/%3E%3Cpath d='M17 20h15c10 0 16 5 16 12S42 44 32 44H17V20Zm10 8v8h6c3 0 5-1 5-4s-2-4-5-4h-6Z' fill='%23d9ff55'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #12082b;
      --purple: #7c3aed;
      --purple-dark: #4c1d95;
      --lime: #d9ff55;
      --cream: #fffaf0;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      overflow-x: hidden;
      color: var(--ink);
      background: var(--cream);
      font-family: "Poppins", Arial, sans-serif;
    }

    .dm-page {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 32px;
      background:
        linear-gradient(rgba(18, 8, 43, .055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(18, 8, 43, .055) 1px, transparent 1px),
        var(--cream);
      background-size: 32px 32px;
    }

    .dm-orb {
      position: absolute;
      z-index: -2;
      border-radius: 50%;
      filter: blur(2px);
      pointer-events: none;
    }

    .dm-orb--one {
      width: 430px;
      height: 430px;
      top: -190px;
      right: -100px;
      background: var(--lime);
      animation: dm-drift-one 8s ease-in-out infinite alternate;
    }

    .dm-orb--two {
      width: 360px;
      height: 360px;
      bottom: -210px;
      left: -100px;
      background: #bda4ff;
      animation: dm-drift-two 10s ease-in-out infinite alternate;
    }

    .dm-shell {
      position: relative;
      width: min(1120px, 100%);
      min-height: 650px;
      display: grid;
      grid-template-columns: 1.08fr .92fr;
      overflow: hidden;
      border: 3px solid var(--ink);
      border-radius: 30px;
      background: var(--white);
      box-shadow: 16px 16px 0 var(--ink);
      animation: dm-enter .75s cubic-bezier(.2, .75, .25, 1) both;
    }

    .dm-copy {
      position: relative;
      padding: clamp(42px, 6vw, 84px);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .dm-badge {
      width: fit-content;
      margin-bottom: 28px;
      padding: 9px 15px;
      border: 2px solid var(--ink);
      border-radius: 999px;
      background: var(--lime);
      box-shadow: 4px 4px 0 var(--ink);
      font-size: .82rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      transform: rotate(-2deg);
    }

    .dm-title {
      margin: 0;
      font-size: clamp(3.2rem, 7.4vw, 6.8rem);
      line-height: .9;
      font-weight: 900;
      letter-spacing: -.065em;
      text-transform: uppercase;
    }

    .dm-title span {
      display: block;
      color: var(--purple);
      -webkit-text-stroke: 2px var(--ink);
      text-shadow: 5px 5px 0 var(--lime);
    }

    .dm-description {
      max-width: 560px;
      margin: 30px 0 0;
      color: #514863;
      font-size: 1rem;
      line-height: 1.75;
    }

    .dm-actions {
      margin-top: 34px;
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .dm-cta {
      position: relative;
      min-height: 58px;
      padding: 15px 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      border: 3px solid var(--ink);
      border-radius: 14px;
      color: var(--white);
      background: var(--purple);
      box-shadow: 7px 7px 0 var(--ink);
      font-size: .95rem;
      font-weight: 800;
      letter-spacing: .035em;
      text-decoration: none;
      text-transform: uppercase;
      transition: transform .22s ease, box-shadow .22s ease, background .22s ease;
    }

    .dm-cta:hover,
    .dm-cta:focus-visible {
      transform: translate(4px, 4px);
      background: var(--purple-dark);
      box-shadow: 3px 3px 0 var(--ink);
      outline: none;
    }

    .dm-cta:active {
      transform: translate(7px, 7px);
      box-shadow: 0 0 0 var(--ink);
    }

    .dm-cta svg {
      width: 23px;
      height: 23px;
      flex: 0 0 auto;
    }

    .dm-note {
      color: #6b6277;
      font-size: .82rem;
      font-weight: 600;
    }

    .dm-visual {
      position: relative;
      min-height: 100%;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-left: 3px solid var(--ink);
      background: var(--purple);
    }

    .dm-visual::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .28;
      background-image: radial-gradient(var(--white) 1.7px, transparent 1.7px);
      background-size: 24px 24px;
      animation: dm-dots 12s linear infinite;
    }

    .dm-logo-card {
      position: relative;
      z-index: 2;
      width: min(320px, 68%);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 4px solid var(--ink);
      border-radius: 34% 66% 64% 36% / 38% 35% 65% 62%;
      background: var(--lime);
      box-shadow: 14px 14px 0 var(--ink);
      animation: dm-morph 8s ease-in-out infinite, dm-float 4s ease-in-out infinite;
    }

    .dm-logo-card::before,
    .dm-logo-card::after {
      content: "";
      position: absolute;
      border: 3px solid var(--ink);
      border-radius: 50%;
      background: var(--white);
    }

    .dm-logo-card::before {
      width: 42px;
      height: 42px;
      top: -16px;
      right: 16px;
    }

    .dm-logo-card::after {
      width: 25px;
      height: 25px;
      bottom: 14px;
      left: -10px;
      background: #ff7a59;
    }

    .dm-monogram {
      color: var(--ink);
      font-size: clamp(4rem, 9vw, 7rem);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -.12em;
      transform: translateX(-.08em) rotate(-5deg);
    }

    .dm-mini-card {
      position: absolute;
      z-index: 3;
      padding: 11px 16px;
      border: 3px solid var(--ink);
      border-radius: 12px;
      color: var(--ink);
      background: var(--white);
      box-shadow: 5px 5px 0 var(--ink);
      font-size: .78rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .dm-mini-card--top {
      top: 16%;
      left: 9%;
      transform: rotate(-7deg);
    }

    .dm-mini-card--bottom {
      right: 8%;
      bottom: 17%;
      background: #ff7a59;
      transform: rotate(7deg);
    }

    .dm-footer {
      position: absolute;
      z-index: 4;
      right: 24px;
      bottom: 18px;
      color: rgba(255, 255, 255, .75);
      font-size: .74rem;
      font-weight: 600;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .dm-footer strong {
      color: var(--lime);
    }

    @keyframes dm-enter {
      from { opacity: 0; transform: translateY(24px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes dm-drift-one {
      to { transform: translate(-45px, 55px) scale(1.08); }
    }

    @keyframes dm-drift-two {
      to { transform: translate(50px, -38px) scale(.92); }
    }

    @keyframes dm-dots {
      to { background-position: 48px 48px; }
    }

    @keyframes dm-morph {
      0%, 100% { border-radius: 34% 66% 64% 36% / 38% 35% 65% 62%; }
      50% { border-radius: 63% 37% 34% 66% / 55% 62% 38% 45%; }
    }

    @keyframes dm-float {
      0%, 100% { transform: translateY(0) rotate(0); }
      50% { transform: translateY(-12px) rotate(1deg); }
    }

    @media (max-width: 820px) {
      .dm-page {
        display: block;
        min-height: 100svh;
        padding: 20px;
        overflow-y: auto;
      }

      .dm-shell {
        min-height: 0;
        grid-template-columns: 1fr;
        box-shadow: 9px 9px 0 var(--ink);
      }

      .dm-copy {
        padding: 48px 28px 42px;
        align-items: center;
        text-align: center;
      }

      .dm-badge {
        margin-bottom: 24px;
      }

      .dm-title {
        font-size: clamp(3rem, 14vw, 5.4rem);
      }

      .dm-title span {
        -webkit-text-stroke-width: 1.5px;
        text-shadow: 4px 4px 0 var(--lime);
      }

      .dm-description {
        margin-top: 24px;
      }

      .dm-actions {
        width: 100%;
        margin-top: 28px;
        justify-content: center;
      }

      .dm-cta {
        width: min(100%, 360px);
      }

      .dm-note {
        width: 100%;
      }

      .dm-visual {
        min-height: 370px;
        border-top: 3px solid var(--ink);
        border-left: 0;
      }

      .dm-logo-card {
        width: min(220px, 58%);
        box-shadow: 9px 9px 0 var(--ink);
      }

      .dm-mini-card--top {
        top: 13%;
        left: 7%;
      }

      .dm-mini-card--bottom {
        right: 6%;
        bottom: 18%;
      }
    }

    @media (max-width: 420px) {
      .dm-page {
        padding: 12px;
      }

      .dm-shell {
        border-radius: 22px;
        box-shadow: 6px 6px 0 var(--ink);
      }

      .dm-copy {
        padding: 38px 20px 34px;
      }

      .dm-title {
        font-size: clamp(2.75rem, 15vw, 4.2rem);
      }

      .dm-description {
        font-size: .96rem;
      }

      .dm-cta {
        padding: 14px 18px;
        font-size: .88rem;
      }

      .dm-visual {
        min-height: 320px;
      }

      .dm-mini-card {
        padding: 8px 11px;
        font-size: .68rem;
      }

      .dm-footer {
        right: 14px;
        bottom: 12px;
        font-size: .64rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .dm-page *,
      .dm-page *::before,
      .dm-page *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

  </main>
</body>
